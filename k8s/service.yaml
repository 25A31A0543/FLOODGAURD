# ============================================================
# FloodGuard AI Platform - Kubernetes Services
# Step 5: Integration & Scaling
# ============================================================

---
apiVersion: v1
kind: Service
metadata:
  name: floodguard-api-svc
  namespace: floodguard
  labels:
    app: floodguard-api
spec:
  type: ClusterIP
  selector:
    app: floodguard-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: floodguard-lb
  namespace: floodguard
  labels:
    app: floodguard-api
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  type: LoadBalancer
  selector:
    app: floodguard-api
  ports:
    - name: https
      port: 443
      targetPort: 8000
      protocol: TCP
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: floodguard-forecast-svc
  namespace: floodguard
spec:
  type: ClusterIP
  selector:
    app: floodguard-forecast
  ports:
    - port: 8001
      targetPort: 8001

---
apiVersion: v1
kind: Service
metadata:
  name: floodguard-alerts-svc
  namespace: floodguard
spec:
  type: ClusterIP
  selector:
    app: floodguard-alerts
  ports:
    - port: 8002
      targetPort: 8002

---
apiVersion: v1
kind: Service
metadata:
  name: floodguard-dashboard-svc
  namespace: floodguard
spec:
  type: ClusterIP
  selector:
    app: floodguard-dashboard
  ports:
    - port: 8003
      targetPort: 8003
