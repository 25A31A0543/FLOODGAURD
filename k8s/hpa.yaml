# ============================================================
# FloodGuard AI Platform - Horizontal Pod Autoscaler
# Step 5: Integration & Scaling
# ============================================================

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: floodguard-api-hpa
  namespace: floodguard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: floodguard-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: floodguard-forecast-hpa
  namespace: floodguard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: floodguard-forecast
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: floodguard-alerts-hpa
  namespace: floodguard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: floodguard-alerts
  minReplicas: 2
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
